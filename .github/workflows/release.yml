name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（手动触发时使用，例如 v0.1.0）"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  RELEASE_NOTES: |
    角色替换插件。

    **Windows**：下载 `charreplace.dll` 放到游戏根目录，并在 `hachimi/config.json` 的
    `windows.load_libraries` 里加上 `"charreplace.dll"`。

    **Android**（arm64）：下载 `libhachimi_charreplace.so` 放到游戏的 native lib 目录 ——
    Hachimi 会自动扫描该目录下所有 `libhachimi_*.so`，无需改配置；也可以在
    `hachimi/config.json` 的 `android.load_libraries` 里写完整路径。

    功能：从 Trainers' Legend G 的 `replaceGlobalChar` 移植，挂钩
    `CharacterBuildInfo::Rebuild` 与 `WorkSingleModeCharaData::GetRaceDressId`；
    配置编辑器内「角色替换」页面，角色与服装都是带搜索的下拉（可直接搜 ID，例如 1114）；
    配置存放在 `hachimi/charreplace.json`，键名兼容 TLG。

    注意：请配合官方版 Hachimi 使用，否则会与 Hachimi 本体内置的同类功能重复替换。

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          mkdir -p dist && cp target/release/charreplace.dll dist/
          gh release create "$TAG" dist/charreplace.dll --title "$TAG" --notes "$RELEASE_NOTES" \
            --repo "${{ github.repository }}" \
          || gh release upload "$TAG" dist/charreplace.dll --clobber --repo "${{ github.repository }}"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk

      - name: Build
        run: cargo ndk -t arm64-v8a build --release --locked

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          cp target/aarch64-linux-android/release/libcharreplace.so libhachimi_charreplace.so
          gh release create "$TAG" libhachimi_charreplace.so --title "$TAG" --notes "$RELEASE_NOTES" \
            --repo "${{ github.repository }}" \
          || gh release upload "$TAG" libhachimi_charreplace.so --clobber --repo "${{ github.repository }}"
