[package]
name = "charreplace"
version = "0.1.0"
edition = "2021"
description = "Global character replacement plugin for Hachimi (ported from Trainers' Legend G)"
license = "GPL-3.0-or-later"
repository = "https://github.com/Yuweisha/hachimi-charreplace-plugin"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
once_cell = "1.19"
